name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - docker-main
  pull_request:
    branches:
      - main
      - docker-main

jobs:
  frontend-setup:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend code
        run: |
          cd frontend
          npm run lint

      - name: Format frontend code with Prettier
        run: |
          cd frontend
          npm run format

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run ESLint Security Checks
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=critical || true

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:ci

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - frontend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Start frontend and backend services
        timeout-minutes: 10
        env:
          SIMULATOR_TYPE: mock
          STORAGE_TYPE: local
          LOCAL_STORAGE_ROOT: /app
        run: |
          mkdir -p "$HOME/Documents/AirSim"
          printf '\nSIMULATOR_TYPE=mock\nSTORAGE_TYPE=local\nLOCAL_STORAGE_ROOT=/app\n' >> backend/.env
          export USERPROFILE="$HOME"
          docker compose -f docker-compose.dev.yaml up -d --build backend frontend

      - name: Wait for backend
        timeout-minutes: 5
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/currentRunning >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yaml logs --tail=200 backend frontend
          exit 1

      - name: Wait for frontend
        timeout-minutes: 5
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yaml logs --tail=200 backend frontend
          exit 1

      - name: Run Cypress end-to-end tests
        run: |
          cd frontend
          npm run cypress:run

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/

      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos/

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/reports/

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yaml logs --tail=300 backend frontend

      - name: Stop frontend and backend services
        if: always()
        timeout-minutes: 5
        run: |
          docker compose -f docker-compose.dev.yaml down --volumes
