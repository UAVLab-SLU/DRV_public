name: DroneWorld
services:
  backend:
    image: droneworld/droneworld-backend:v1.0.0
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials
      - ./config/airsim:/root/Documents/AirSim
      - type: bind
        source: ${DRONELUME_CONFIG_DIR:-./config/dronelume}
        target: /app/dronelume-config
    depends_on:
      fake-gcs:
        condition: service_healthy
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DRV_UNREAL_HOST=drv-unreal
      - DRV_UNREAL_API_PORT=3001
      - DRV_PIXELSTREAM_PORT=8888
      - AIRSIM_HOST=drv-unreal
      - AIRSIM_PORT=41451
      - DRONELUME_CONFIG_DIR=/app/dronelume-config
    networks:
      - droneworld-network

  frontend:
    image: droneworld/droneworld-frontend:v1.0.0
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ${CESIUM_CREDENTIALS_DIR:-./credentials}:/credentials:ro
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - CESIUM_TOKEN_FILE=/credentials/frontend-cesium-token.json
      - PIXELSTREAM_URL=ws://localhost:8888
      - VITE_PIXELSTREAM_URL=${VITE_PIXELSTREAM_URL:-http://localhost:8888}
      - VITE_SIMULATOR_CONTROL_URL=${VITE_SIMULATOR_CONTROL_URL:-http://127.0.0.1:8890}
      - BACKEND_URL=http://backend:5000
      - REACT_APP_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - droneworld-network

  drv-unreal:
    profiles: [linux-simulator]
    image: droneworld/drv-unreal:linux
    build:
      context: ./sim
      dockerfile: Dockerfile
      args:
        DRV_RELEASE_TAG: ${DRV_RELEASE_TAG:-latest}
    depends_on:
      signalling:
        condition: service_healthy
    ports:
      - "3001:3000"
      - "41451:41451"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video,display
    volumes:
      - drv-data:/opt/drv/data
      - ${AIRSIM_SETTINGS_DIR:-./config/airsim}:/home/unreal/Documents/AirSim
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - droneworld-network
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi >/dev/null && pgrep -f 'DRV-Linux|Blocks|SADE_drone_rep' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  signalling:
    profiles: [linux-simulator, windows-simulator]
    image: pixelstreamingunofficial/pixel-streaming-signalling-server:5.5
    command:
      - "--publicip"
      - "${PIXELSTREAM_PUBLIC_IP:-127.0.0.1}"
      - "--turn"
      - "host.docker.internal:3478"
      - "--turn-user"
      - "${PIXELSTREAM_TURN_USER:-drv}"
      - "--turn-pass"
      - "${PIXELSTREAM_TURN_PASSWORD:-drv-local-only}"
      - "--start-turn"
      - "--console_messages"
      - "verbose"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PIXELSTREAM_HTTP_PORT:-8888}:80"
      - "127.0.0.1:${PIXELSTREAM_STREAMER_PORT:-8889}:8888"
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./sim/turnserver.conf:/SignallingWebServer/turnserver.conf:ro
    networks:
      - droneworld-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:80/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  fake-gcs:
    image: fsouza/fake-gcs-server
    ports:
      - "4443:4443"
    command: -scheme http -port 4443 -external-url http://fake-gcs:4443 -log-level error
    volumes:
      - ./fake-gcs-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - droneworld-network

  init-storage:
    image: curlimages/curl:latest
    depends_on:
      fake-gcs:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        curl -X POST http://fake-gcs:4443/storage/v1/b \
          -H 'Content-Type: application/json' \
          -d '{"name":"droneworld"}'
    networks:
      - droneworld-network

networks:
  droneworld-network:
    driver: bridge

volumes:
  fake-gcs-data:
  drv-data:
